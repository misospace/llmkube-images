[settings]
experimental = true
unix_default_inline_shell_args = "bash -c -o errexit -o pipefail -o nounset"

[tools]
gh = "2.97.0"
go = "1.26.5"
jq = "1.8.2"
lefthook = "2.1.10"
node = "26.7.0"
oxfmt = "0.63.0"
shellcheck = "0.11.0"
yq = "4.53.3"
zizmor = "1.29.0"

[tasks.local-build]
description = "Build and test an app locally"
dir = "{{config_root}}"
usage = '''
arg "<app>"
'''
run = '''
docker buildx bake -f "{{config_root}}/apps/$1/docker-bake.hcl" --no-cache --metadata-file docker-bake.json --set=*.output=type=docker --load --set=*.args.VERSION=$(date +%Y%m%d%H%M%S) image-local
TEST_IMAGE="$(jq -r '."image-local"."image.name" | sub("^docker.io/library/"; "")' docker-bake.json)" go test -v {{config_root}}/apps/"$1"/...
'''

[tasks.remote-build]
description = "Trigger a remote build"
usage = '''
arg "<app>"
arg "[release]" help="release flag (default: false)"
'''
run = 'gh workflow run release.yaml -f app="$1" -f release="${2:-false}"'

[tasks.generate-label-config]
hide = true
run = '''
find "{{config_root}}/apps" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | while IFS= read -r app; do
    yq -i ". += {\"app/$app\": [{\"changed-files\": [{\"any-glob-to-any-file\": [\"apps/$app/**\"]}]}]}" {{config_root}}/.github/labeler.yaml
done
'''

[hooks]
postinstall = ["mkdir -p {{config_root}}/.cache", "lefthook install"]

